name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-secret-at-least-64-characters-long-for-next
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      AUTH_PROVIDER: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Verify no pending migrations exist before merge (ADR-0008)
      - run: npm run prisma:migrate:status
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
