name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5.4.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen --extra dev
      - name: Ruff check
        run: uv run ruff check backend/src backend/tests
      - name: Ruff format check
        run: uv run ruff format --check backend/src backend/tests
      - name: Mypy
        run: uv run mypy backend/src/app

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-test-secret-at-least-32-chars-long' }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.NEON_DATABASE_URL_DIRECT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8000/auth/google/callback
      GOOGLE_OAUTH_ALLOWED_DOMAIN: emb.global
      APP_ENV: development
      AUTH_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5.4.0
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run pytest backend/tests -v --tb=short
