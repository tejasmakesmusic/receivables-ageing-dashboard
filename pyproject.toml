[project]
name = "receivables-ageing-dashboard"
version = "0.1.0"
description = "EMB Global internal receivables ageing platform (India/Tally + UAE/Xero)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Tejaswa Sharma", email = "tejaswa.sharma@emb.global" },
]

# Runtime dependencies — locked to spec §bootstrap tooling choices.
dependencies = [
  # Web
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "starlette>=0.41,<0.42",
  "python-multipart>=0.0.17,<0.0.18",  # for multipart uploads (S1)
  # Data
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<1.15",
  "psycopg[binary]>=3.2,<3.3",         # Postgres driver (SQLAlchemy 2.x)
  # Schemas / config
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  # Auth / session
  "authlib>=1.3,<2",                   # Google OAuth (D4)
  "itsdangerous>=2.2,<3",              # signed-cookie sessions (§11)
  "httpx>=0.27,<0.28",                 # Google OAuth token exchange (auth.py)
  # Logging
  "structlog>=24.4,<25",
  # Scheduling
  "apscheduler>=3.10,<4",              # cron for CFO digest (§8.1)
  # Rate limiting
  "slowapi>=0.1.9,<0.2",
  # Parsers / matching
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",                    # xlsx parsing only
  "rapidfuzz>=3.10,<4",                # fuzzy alias matching (D11)
  # Email providers (keep both; one is selected at runtime via EMAIL_PROVIDER)
  "resend>=2.4,<3",
  "sendgrid>=6.11,<7",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  # Testing
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "factory-boy>=3.3,<4",
  "freezegun>=1.5,<2",                 # ageing/date tests

  # Linting / typing
  "ruff>=0.7,<0.8",
  "black>=24.10,<25",
  "mypy>=1.13,<2",
  "types-python-dateutil>=2.9,<3",

  # Pre-commit
  "pre-commit>=4.0,<5",

  # Test utilities
  "python-dotenv>=1.0,<2",
]

# ---------------------------------------------------------------------------
# Package layout — `src` layout per convention
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/app"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests"]
extend-exclude = ["backend/alembic/versions", "frontend/node_modules", "frontend/dist"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "N",             # pep8-naming
  "RUF",           # ruff rules
  "SIM",           # simplify
  "TCH",           # type-checking blocks
  "TID",           # tidy imports
  "PL",            # pylint subset
]
ignore = [
  "E501",          # line too long — black handles
  "PLR0913",       # too many args in fn
  "RUF002",        # en-dashes in docstrings (mirror spec prose)
  "RUF003",        # en-dashes in comments
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["PLR2004", "PLR0915"]   # magic numbers and long test fns are fine
# SQLAlchemy resolves Mapped[...] annotations at class creation time by
# inspecting the class namespace. Moving uuid/datetime under TYPE_CHECKING
# breaks that resolution — they must be runtime imports in model files.
"backend/src/app/db/models/*.py" = ["TCH003"]
# pydantic v2 with `from __future__ import annotations` requires date/Decimal
# at runtime in the module namespace — model_rebuild() would be needed otherwise.
"backend/src/app/parsers/common.py" = ["TCH003"]
# `date` is used in local type annotations at runtime (parsed_date: date | None)
# and in the ParseResult.as_of_date field passed to pydantic — must be runtime.
"backend/src/app/parsers/tally.py" = ["TCH003"]
"backend/src/app/parsers/xero.py" = ["TCH003"]
# uuid.UUID is used at runtime in pydantic field types and function signatures.
"backend/src/app/services/alias_resolver.py" = ["TCH003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "backend/alembic/versions"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
files = ["backend/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "slowapi.*", "factory_boy.*", "sendgrid.*", "resend.*", "openpyxl.*", "pandas.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
asyncio_mode = "auto"
markers = [
  "unit: fast isolated tests (no DB, no network)",
  "integration: require Postgres",
  "parser: parser tests against real sample files",
  "serial: must not run concurrently with other DB-mutating tests (e.g. downgrade/upgrade round-trips)",
  "slow: performance tests skipped in CI by default",
]

[dependency-groups]
dev = [
    "pytest-repeat>=0.9.4",
]
