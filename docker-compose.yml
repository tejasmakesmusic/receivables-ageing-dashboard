# Local dev helper. Postgres runs on Neon (ADR-0002), not in a container.
# This compose file is now optional — use it only if you want to run the
# backend and/or frontend inside containers instead of natively with uv/npm.
#
# Usage:
#   # Run backend in a container, hitting Neon via DATABASE_URL from .env:
#   docker compose up backend
#
#   # Or run everything containerised:
#   docker compose up

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    container_name: receivables-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./pyproject.toml:/app/pyproject.toml
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend/src

  frontend:
    image: node:22-alpine
    container_name: receivables-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
