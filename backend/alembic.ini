# Alembic configuration — run from repo root:
#   uv run alembic -c backend/alembic.ini upgrade head
#
# DATABASE_URL is read dynamically from env by alembic/env.py,
# so sqlalchemy.url below is intentionally blank.

[alembic]
script_location = backend/alembic
prepend_sys_path = backend/src
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
hooks = ruff,black
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
